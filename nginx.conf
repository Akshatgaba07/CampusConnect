# Edge reverse proxy + load balancer. Browser -> this -> (frontend | backend replicas). qr-service is NOT exposed here.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  client_max_body_size 1m;

  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream backend_pool {
    ip_hash;                       # sticky per client: required for Socket.IO long-polling handshakes across replicas
    server backend:4000 max_fails=3 fail_timeout=10s;   # Docker DNS returns every replica's IP
  }
  upstream frontend_pool { server frontend:80; }

  server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/auth/ {
      limit_req zone=auth_zone burst=10 nodelay;
      proxy_pass http://backend_pool;
      include /etc/nginx/proxy_params_cc;
    }
    location /api/ {
      proxy_pass http://backend_pool;
      include /etc/nginx/proxy_params_cc;
    }
    location /socket.io/ {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      include /etc/nginx/proxy_params_cc;
    }
    location / {
      proxy_pass http://frontend_pool;
      include /etc/nginx/proxy_params_cc;
    }
  }
}
